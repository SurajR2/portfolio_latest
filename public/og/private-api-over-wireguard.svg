    <rect x="944" y="372" width="156" height="58" rx="6" fill="#18191B" stroke="#3A3D42" stroke-width="1.5"/>
    <text x="1022" y="400" fill="#ECEDEE" font-size="19" text-anchor="middle">server</text>
    <text x="1022" y="420" fill="#5A5F66" font-size="13" text-anchor="middle">10.66.66.1</text>
  </g>

