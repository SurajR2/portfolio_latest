  <!-- title -->
  <text x="100" y="252" fill="#ECEDEE" font-size="56" font-weight="700" letter-spacing="-1">Private API over <tspan fill="#F5A524">WireGuard</tspan></text>

  <!-- subtitle -->
  <text x="100" y="300" fill="#8B9097" font-size="24">the network boundary <tspan fill="#ECEDEE" font-style="italic">is</tspan> the security control</text>

  <!-- ===== tunnel diagram ===== -->
  <g>
    <!-- client node -->
    <rect x="100" y="372" width="156" height="58" rx="6" fill="#18191B" stroke="#3A3D42" stroke-width="1.5"/>
