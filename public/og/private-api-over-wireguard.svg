  <g font-size="16" fill="#8B9097">
    <rect x="100" y="468" width="120" height="34" rx="3" fill="none" stroke="#3A3D42" stroke-width="1.2"/>
    <text x="160" y="490" text-anchor="middle">wireguard</text>
