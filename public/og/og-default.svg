<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">
  <!-- base -->
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- subtle grid -->
  <g stroke="#25272B" stroke-width="1" opacity="0.35">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200 M0 480 H1200 M0 560 H1200"/>
    <path d="M80 0 V630 M160 0 V630 M240 0 V630 M320 0 V630 M400 0 V630 M480 0 V630 M560 0 V630 M640 0 V630 M720 0 V630 M800 0 V630 M880 0 V630 M960 0 V630 M1040 0 V630 M1120 0 V630"/>
  </g>
  <!-- corner glows -->
  <circle cx="1140" cy="60" r="220" fill="#F5A524" opacity="0.06"/>
  <circle cx="60" cy="600" r="200" fill="#06B6D4" opacity="0.05"/>

  <!-- terminal window -->
  <rect x="60" y="60" width="1080" height="510" rx="8" fill="#111213" stroke="#25272B" stroke-width="1.5"/>

  <!-- title bar -->
  <line x1="60" y1="112" x2="1140" y2="112" stroke="#25272B" stroke-width="1.5"/>
  <circle cx="94" cy="86" r="7" fill="#EF4444"/>
  <circle cx="118" cy="86" r="7" fill="#EAB308"/>
  <circle cx="142" cy="86" r="7" fill="#16A34A"/>
  <text x="178" y="92" fill="#5A5F66" font-size="15">suraj@portfolio: ~</text>

  <!-- identity -->
  <text x="600" y="222" font-size="22" text-anchor="middle"><tspan fill="#F5A524" font-weight="700">$</tspan><tspan fill="#8B9097" xml:space="preserve">  whoami</tspan></text>

  <text x="600" y="312" fill="#ECEDEE" font-size="62" font-weight="700" letter-spacing="-1.5" text-anchor="middle">Suraj Rasaili BK</text>

  <text x="600" y="362" font-size="25" text-anchor="middle"><tspan fill="#F5A524">Full Stack Developer</tspan><tspan fill="#3A3D42">  ·  </tspan><tspan fill="#8B9097">backend systems</tspan><tspan fill="#3A3D42">  ·  </tspan><tspan fill="#8B9097">clean architecture</tspan></text>

  <!-- stack pills (centered) -->
  <g font-size="18">
    <rect x="372" y="410" width="142" height="38" rx="3" fill="none" stroke="#3A3D42" stroke-width="1.2"/>
    <text x="443" y="435" fill="#06B6D4" text-anchor="middle">typescript</text>
    <rect x="530" y="410" width="104" height="38" rx="3" fill="none" stroke="#3A3D42" stroke-width="1.2"/>
    <text x="582" y="435" fill="#8B9097" text-anchor="middle">nestjs</text>
    <rect x="650" y="410" width="146" height="38" rx="3" fill="none" stroke="#3A3D42" stroke-width="1.2"/>
    <text x="723" y="435" fill="#8B9097" text-anchor="middle">postgresql</text>
    <rect x="812" y="410" width="96" height="38" rx="3" fill="none" stroke="#3A3D42" stroke-width="1.2"/>
    <text x="860" y="435" fill="#8B9097" text-anchor="middle">react</text>
  </g>

  <!-- footer -->
  <line x1="100" y1="510" x2="1100" y2="510" stroke="#25272B" stroke-width="1.5"/>
  <text x="100" y="540" font-size="17"><tspan fill="#F5A524" font-weight="700">$</tspan><tspan fill="#8B9097" xml:space="preserve">  cat ~/about</tspan></text>
  <text x="1100" y="540" fill="#5A5F66" font-size="17" text-anchor="end">surajrasaili.com.np</text>
